name: etl-example
tasks:
  - id: extract
    runtime: python
    image: python:3.13-slim
    dependencies:
      - pydantic
      - pyyaml
    include:
      - includes/payload_utils.py
    env:
      TASK_AUTH: "Bearer ${API_TOKEN}"
    script: |
      import json
      import os
      import yaml
      from payload_utils import build_payload

      pipeline_env = os.environ.get("PIPELINE_ENV", "unknown")
      source_label = os.environ.get("SOURCE_LABEL", "default")
      api_token = os.environ.get("API_TOKEN", "")
      task_auth = os.environ.get("TASK_AUTH", "")

      print(f"[extract] PIPELINE_ENV={pipeline_env}")
      print(f"[extract] SOURCE_LABEL={source_label}")
      print(f"[extract] API_TOKEN={api_token}")
      print(f"[extract] TASK_AUTH={task_auth}")

      payload = build_payload(
          message="Hello from Python extract task",
          env=pipeline_env,
          source=source_label,
          numbers=[10, 20, 30, 42],
      )

      print("[extract] Validated payload YAML:")
      print(yaml.safe_dump(payload.model_dump(), sort_keys=False).strip())

      output_path = "/workspace/payload.json"
      with open(output_path, "w", encoding="utf-8") as f:
          json.dump(payload.model_dump(), f, indent=2)

      print(f"Wrote payload to {output_path}")

  - id: transform
    runtime: js
    depends_on:
      - extract
    dependencies:
      - lodash-es
      - ms
    include:
      - includes/math_utils.ts
    script: |
      import { readFileSync } from "fs";
      import { sum } from "lodash-es";
      import ms from "ms";
      import { formatStats } from "/includes/math_utils.ts";

      const raw = readFileSync("/workspace/payload.json", "utf-8");
      const data = JSON.parse(raw);

      const numbers: number[] = Array.isArray(data.numbers) ? data.numbers : [];
      const total = sum(numbers);

      console.log(`[transform] PIPELINE_ENV=${process.env.PIPELINE_ENV ?? "unknown"}`);
      console.log(`[transform] SOURCE_LABEL=${process.env.SOURCE_LABEL ?? "default"}`);
      console.log(`[transform] API_TOKEN=${process.env.API_TOKEN ?? ""}`);
      console.log(`Message: ${data.message}`);
      console.log(`Source: ${data.source}`);
      console.log(`Numbers: ${JSON.stringify(numbers)}`);
      console.log(formatStats(numbers, total));
      console.log(`Window: ${ms("2h")}`);

{{define "content"}}
<div class="page-head">
  <div>
    <h1 class="page-title">Executions</h1>
    <p class="page-sub">All workflow runs ordered from newest to oldest</p>
  </div>
  <span class="badge badge-neutral">Auto-refresh 3s</span>
</div>

<section class="card">
  <div class="card-head">
    <h2 class="card-title">Execution History</h2>
    <form method="get" action="/executions" class="toolbar">
      <input class="input" type="search" name="q" value="{{.Query}}" placeholder="Search run ID, flow, or user..."
             hx-get="/partials/executions"
             hx-include="[name='status'],[name='q']"
             hx-target="#executions-body"
             hx-swap="innerHTML"
             hx-trigger="input changed delay:250ms, search">
      <select class="select" name="status"
              hx-get="/partials/executions"
              hx-include="[name='status'],[name='q']"
              hx-target="#executions-body"
              hx-swap="innerHTML">
        <option value="" {{if eq .StatusFilter ""}}selected{{end}}>All statuses</option>
        <option value="SUCCESS" {{if eq .StatusFilter "SUCCESS"}}selected{{end}}>SUCCESS</option>
        <option value="FAILED" {{if eq .StatusFilter "FAILED"}}selected{{end}}>FAILED</option>
        <option value="KILLED" {{if eq .StatusFilter "KILLED"}}selected{{end}}>KILLED</option>
        <option value="RUNNING" {{if eq .StatusFilter "RUNNING"}}selected{{end}}>RUNNING</option>
      </select>
    </form>
  </div>

  <div id="executions-body"
       hx-get="/partials/executions"
       hx-include="[name='status'],[name='q'],[name='page']"
       hx-trigger="every 3s"
       hx-swap="innerHTML">
    {{template "executions_table" .}}
  </div>
</section>
{{end}}

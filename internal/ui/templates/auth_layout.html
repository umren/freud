{{define "auth_layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Freud</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('freud-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card card">
      <div class="card-head">
        <div class="brand" style="margin-bottom:0">
          <div class="brand-mark">F</div>
          <div>
            <div class="brand-title">Freud</div>
            <div class="brand-sub">Task Orchestrator · Dream UI</div>
          </div>
        </div>
      </div>
      <div class="card-body">
        {{template "auth_content" .}}
      </div>
    </div>
  </div>
</body>
</html>
{{end}}

name: kill-demo
tasks:
  - id: wait_ten_seconds
    image: alpine:3.20
    script: |
      echo "[kill-demo] Starting 10-second task (click 'Kill Run' in the UI to stop it)..."
      for i in $(seq 1 10); do
        echo "[kill-demo] Tick $i / 10"
        sleep 1
      done
      echo "[kill-demo] Finished waiting 10 seconds."

  - id: after_wait
    image: alpine:3.20
    depends_on:
      - wait_ten_seconds
    script: |
      echo "[kill-demo] This step runs only if wait_ten_seconds was NOT killed."
